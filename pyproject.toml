[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["pycore", ".venv", "frontend", "node_modules"]
src = ["backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
explicit_package_bases = true
ignore_missing_imports = true
show_error_codes = true
exclude = ["pycore/", ".venv/", "frontend/"]

[[tool.mypy.overrides]]
module = "pycore.*"
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
timeout = 120
