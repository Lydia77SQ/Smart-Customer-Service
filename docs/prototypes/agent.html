<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>坐席接待 · 智能客服系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@600&display=swap" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">智能客服系统</div>
      <nav class="nav">
        <a href="./employee.html">员工咨询</a>
        <a class="is-active" href="./agent.html">坐席接待</a>
        <a href="./knowledge.html">知识维护</a>
      </nav>
      <div class="topbar-right">王丽<a class="btn-secondary btn" href="./login.html" style="height:32px">退出</a></div>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <h2>工单</h2>
        <div class="seg">
          <button type="button" class="is-active">待处理</button>
          <button type="button">处理中</button>
        </div>
        <div class="show-loading">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
        <div class="empty show-empty">当前没有待处理工单。</div>
        <div class="list hide-empty hide-loading">
          <button class="item is-active" type="button">
            <span class="title"><span class="dot dot-wait"></span>王丽 · VPN 连不上公司内网</span>
            <span class="meta">等待 12 分钟</span>
          </button>
          <button class="item" type="button">
            <span class="title"><span class="dot dot-wait"></span>陈浩 · 会议室投影仪没有画面</span>
            <span class="meta">等待 3 分钟</span>
          </button>
        </div>
      </aside>
      <section class="main hide-empty hide-loading">
        <div class="status-bar">待处理 · 员工已转人工，上下文已保留</div>
        <div class="thread">
          <div class="bubble bubble-me" style="align-self:flex-start;background:#fff;color:inherit;border:1px solid var(--color-line)">
            <div class="who" style="color:var(--color-muted)">王丽</div>公司 VPN 连不上，提示认证失败。
          </div>
          <div class="bubble bubble-sys"><div class="who">系统</div>请补充你用的是 Windows 还是 Mac，以及大约从什么时候开始失败。</div>
          <div class="bubble bubble-me" style="align-self:flex-start;background:#fff;color:inherit;border:1px solid var(--color-line)">
            <div class="who" style="color:var(--color-muted)">王丽</div>Windows。今天早上开始的。
          </div>
        </div>
        <div class="composer">
          <textarea class="input" id="composer" placeholder="回复员工"></textarea>
          <button class="btn" id="btn-send" type="button">发送</button>
        </div>
      </section>
      <aside class="panel hide-empty hide-loading">
        <h2>当前工单</h2>
        <div class="block">
          <button class="btn" id="btn-accept" type="button" style="width:100%">接入处理</button>
          <label>分类
            <select class="select" id="classify">
              <option>IT-网络</option>
              <option>IT-账号</option>
              <option>行政-工牌</option>
              <option>行政-场地</option>
            </select>
          </label>
          <label>智能回答</label>
          <button class="btn btn-secondary" type="button" id="btn-suggest" style="width:100%;margin-bottom:8px">获取建议</button>
          <div class="suggest" id="suggest-box" hidden>请确认是否使用公司门户的 VPN 客户端，并尝试忘记密码后用邮箱验证码重置。</div>
          <p class="hint" id="suggest-fail" hidden>暂时无法生成建议。请手写回复，不要向员工发送自动消息。</p>
          <button class="btn btn-secondary" type="button" style="width:100%;margin-top:8px">填入输入框</button>
          <button class="btn btn-danger" id="btn-close" type="button" style="width:100%;margin-top:12px" disabled>结束工单</button>
        </div>
      </aside>
    </div>
  </div>
  <script>
    const state = new URLSearchParams(location.search).get("state") || "default";
    document.body.dataset.state = state;
    const send = document.getElementById("btn-send");
    const box = document.getElementById("composer");
    const accept = document.getElementById("btn-accept");
    const closeBtn = document.getElementById("btn-close");
    const classify = document.getElementById("classify");
    if (state === "default") {
      send.disabled = true;
      box.disabled = true;
      box.placeholder = "请先接入后再回复";
    }
    if (state === "doing") {
      accept.textContent = "已接入";
      accept.disabled = true;
      closeBtn.disabled = false;
      send.disabled = false;
      box.disabled = false;
      document.getElementById("suggest-box").hidden = false;
      document.querySelector(".status-bar").textContent = "处理中 · 系统不再自动对外发言";
    }
    if (state === "closed") {
      send.disabled = true;
      box.disabled = true;
      accept.disabled = true;
      closeBtn.disabled = true;
      classify.disabled = true;
      box.placeholder = "已完结，不能再发送";
    }
    if (state === "error") {
      document.getElementById("suggest-box").hidden = true;
      document.getElementById("suggest-fail").hidden = false;
    }
  </script>
</body>
</html>
